title: Body School
intro: The course moves from how the body is organized to each major system, then to how those systems work together.
units:
  - id: organization
    title: How the body is organized
    description: How cells, tissues, organs, and systems fit together, from smallest to largest.
    lessons:
      - cells-tissues-organs-and-systems
  - id: support
    title: Support and movement
    description: How bones, joints, and muscles protect the body, hold it up, and move it.
    lessons:
      - bones-joints-and-muscles
  - id: circulation
    title: Oxygen and blood
    description: How the lungs and the heart move oxygen in and carbon dioxide out.
    lessons:
      - lungs-heart-and-blood
  - id: fuel
    title: Food and waste
    description: How the body breaks down food and removes liquid waste.
    lessons:
      - stomach-intestines-and-liver
      - kidneys-and-bladder
  - id: control
    title: Signals and responses
    description: How the brain and nerves carry information and decide how to respond.
    lessons:
      - brain-and-nerves
  - id: reproduction
    title: The reproductive system
    description: How the reproductive organs make it possible for a baby to begin and grow.
    lessons:
      - reproductive-organs
  - id: protection
    title: Defense
    description: How white blood cells and their organs find and fight germs.
    lessons:
      - immune-system
  - id: together
    title: Systems working together
    description: How cells, tissues, organs, and systems depend on one another.
    lessons:
      - systems-working-together
