title: Body School
intro: Build a middle-school foundation in how major organs and body systems work together. Each lesson is planned for about 10 minutes, including five concept questions. Start each unit with a preview and finish with a review. Scientific terms are explained in context; clear reasoning matters more than memorizing names. Reproductive anatomy and systems are outside this course’s scope.
units:
  - id: organization
    title: "Unit 1: From Cells to Systems"
    description: Build a model of cells, tissues, organs, and systems that will support every later unit.
    lessons:
      - organization-intro
      - organization-01-cells-and-tissues
      - organization-02-organs-and-systems
      - organization-03-working-together
      - organization-review
  - id: support
    title: "Unit 2: Support and Movement"
    description: Explain how living bones, joints, and muscles cooperate to support and move the body.
    lessons:
      - support-intro
      - support-01-bones-and-joints
      - support-02-muscles-and-movement
      - support-03-skeleton-and-muscles-together
      - support-review
  - id: circulation
    title: "Unit 3: Circulation and Breathing"
    description: Follow the pump, transport routes, blood components, and gas exchange as separate short lessons.
    lessons:
      - circulation-intro
      - circulation-01-the-heart-and-blood
      - circulation-blood-deliveries
      - circulation-02-blood-vessels-and-exchange
      - circulation-breathing-mechanics
      - circulation-03-lungs-and-breathing
      - circulation-review
  - id: fuel
    title: "Unit 4: Fuel and Waste"
    description: Separate food breakdown, absorption, digestive helpers, kidney filtering, and water balance.
    lessons:
      - fuel-intro
      - fuel-01-digestion-from-mouth-to-stomach
      - fuel-accessory-organs
      - fuel-02-small-intestine-and-absorption
      - fuel-03-kidneys-and-urine
      - fuel-water-balance
      - fuel-review
  - id: control
    title: "Unit 5: Control and Coordination"
    description: Connect sensory information, nerve responses, hormone messages, and feedback.
    lessons:
      - control-intro
      - control-01-brain-and-nerves
      - control-reflexes
      - control-eyes-and-vision
      - control-ears-and-balance
      - control-02-hormones-and-glands
      - control-03-homeostasis
      - control-review
  - id: protection
    title: "Unit 6: Protection and Defense"
    description: Distinguish barriers, early defense, immune memory, and lymph transport.
    lessons:
      - protection-intro
      - protection-01-skin-and-its-jobs
      - protection-02-immune-cells-and-lymph
      - protection-03-barriers-and-responses
      - protection-review
  - id: together
    title: "Unit 7: Systems Working Together"
    description: Apply the course model to activity, meals, recovery, and new situations.
    lessons:
      - together-intro
      - together-01-exercise-and-energy
      - together-02-eating-and-recovery
      - together-03-final-connections
      - together-review
