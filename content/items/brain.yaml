summary: The main control organ, with regions for thinking, movement, balance, and automatic jobs such as breathing rate.
traits:
  - text: The large wrinkled cerebrum handles thinking, sensing, and voluntary movement.
    source: openstax-cns
  - text: The cerebellum, tucked at the back, helps with balance and smooth movement.
    source: openstax-cns
  - text: The brainstem keeps basic jobs going, including breathing rate and heart rate.
