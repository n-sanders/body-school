slug: spleen
name: Spleen
category: protection
attributes:
  system: Lymphatic and immune
  location: Upper left abdomen
  role: Filters blood and helps immune cells
summary: A fist-sized organ that filters blood, recycles old red blood cells, and helps the immune response.
traits:
  - text: The spleen sits in the upper left abdomen, tucked near the stomach.
    source: openstax-lymph
  - text: It filters blood rather than lymph, and it removes worn-out red blood cells.
    source: wikipedia-spleen
  - text: Immune cells in the spleen watch the blood for invaders.
    source: openstax-lymph
