slug: liver
name: Liver
category: fuel
attributes:
  system: Digestive
  location: Upper abdomen, mostly on the right
  role: Makes bile and processes nutrients
summary: A large organ that makes bile for fat digestion and handles many nutrients arriving from the intestine.
traits:
  - text: The liver makes bile, which helps break fats into smaller droplets.
    source: openstax-accessory
  - text: The gallbladder is a small sac that stores bile until a meal needs it.
    source: openstax-accessory
  - text: Blood from the intestines visits the liver before those nutrients travel on to the rest of the body.
    source: wikipedia-liver
lookAlikes:
  - stomach
  - pancreas
  - diaphragm
