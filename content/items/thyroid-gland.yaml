slug: thyroid-gland
name: Thyroid and pituitary glands
category: control
attributes:
  system: Endocrine
  location: Neck, and the base of the brain
  role: Release hormones that guide growth and metabolism
summary: The butterfly-shaped thyroid in the neck and the small pituitary at the base of the brain.
traits:
  - text: The pituitary is often called a master gland because its hormones tell other glands what to do.
    source: openstax-endocrine
  - text: The thyroid sits against the windpipe and releases hormones that set the pace of metabolism.
    source: openstax-thyroid
  - text: Hormone messages travel in the blood, so they are slower than nerve signals but can last longer.
    source: openstax-endocrine
