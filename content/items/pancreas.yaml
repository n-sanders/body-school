slug: pancreas
name: Pancreas
category: fuel
attributes:
  system: Digestive and endocrine
  location: Behind the stomach
  role: Makes digestive enzymes and insulin
summary: A long gland that pours enzymes into the small intestine and releases insulin and glucagon into the blood.
traits:
  - text: Most of the pancreas makes digestive enzymes and bicarbonate that empty into the small intestine.
    source: openstax-accessory
  - text: Small clusters of cells in the pancreas release insulin, which helps lower blood sugar.
    source: openstax-pancreas
  - text: Glucagon from the pancreas has the opposite job and helps raise blood sugar.
    source: openstax-pancreas
lookAlikes:
  - liver
  - stomach
  - thyroid-gland
