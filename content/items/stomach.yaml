slug: stomach
name: Stomach
category: fuel
attributes:
  system: Digestive
  location: Upper abdomen, mostly on the left
  role: Churns food with acid and enzymes
summary: A J-shaped muscular sac that stores a meal and begins breaking it down.
traits:
  - text: The stomach squeezes and mixes food with acid and enzymes such as pepsin.
    source: openstax-stomach
  - text: A mucus lining protects the stomach wall from its own acid.
    source: wikipedia-stomach
  - text: The stomach gradually releases a soupy mixture into the small intestine; timing depends on the meal.
    source: openstax-stomach
lookAlikes:
  - liver
  - pancreas
  - kidneys
