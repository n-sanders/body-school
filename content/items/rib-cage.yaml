slug: rib-cage
name: Rib cage
category: support
attributes:
  system: Skeletal
  location: Chest
  role: Protects the heart and lungs
summary: Curved ribs and a central breastbone that form a flexible cage around the heart and lungs.
traits:
  - text: The rib cage shields the heart and lungs while still leaving room for the chest to expand.
    source: openstax-skeleton
  - text: Ribs curve out from the spine and most of them meet the breastbone at the front.
    source: wikipedia-rib
  - text: Cartilage lets the cage spring a little with each breath instead of staying rigid.
    source: wikipedia-rib
lookAlikes: [skull, spine]
