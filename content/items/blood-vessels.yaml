slug: blood-vessels
name: Blood vessels
category: circulation
attributes:
  system: Circulatory
  location: Throughout the body
  role: Carry blood to and from the heart
summary: A branching network of arteries, capillaries, and veins.
traits:
  - text: Arteries carry blood away from the heart. Veins carry it back.
    source: openstax-vessels
  - text: Capillaries are the tiny thin-walled vessels where oxygen, nutrients, and wastes are exchanged.
    source: openstax-vessels
  - text: Many veins have valves that keep blood from sliding backward on its way to the heart.
    source: wikipedia-vessel
