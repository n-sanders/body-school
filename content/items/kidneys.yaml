slug: kidneys
name: Kidneys
category: fuel
attributes:
  system: Urinary
  location: Back of the abdomen, one on each side
  role: Filter blood and make urine
summary: A pair of bean-shaped filters that clean the blood and send urine toward the bladder.
traits:
  - text: The kidneys filter blood all day, then return useful water, salts, and nutrients to the blood.
    source: openstax-kidney
  - text: Wastes and extra water leave as urine, travel down the ureters, and are stored in the bladder.
    source: openstax-kidney
  - text: The kidneys also help balance water, salts, and blood pressure.
    source: wikipedia-kidney
