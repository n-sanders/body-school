slug: diaphragm
name: Diaphragm
category: circulation
attributes:
  system: Respiratory
  location: Under the lungs
  role: Pulls air into the lungs
summary: A broad breathing muscle below the lungs; its contraction helps enlarge chest space during inhalation.
traits:
  - text: The diaphragm sits under both lungs and separates the chest from the abdomen.
    source: wikipedia-diaphragm
  - text: When it contracts and moves downward, chest space increases and pressure in the lungs falls slightly, allowing air in.
    source: openstax-breathing
  - text: During activity, breathing can become faster, deeper, or both to support gas exchange as tissue demands change.
    source: openstax-breathing
