slug: diaphragm
name: Diaphragm
category: circulation
attributes:
  system: Respiratory
  location: Under the lungs
  role: Pulls air into the lungs
summary: A dome-shaped sheet of muscle that flattens to draw air in and relaxes to push air out.
traits:
  - text: The diaphragm sits under both lungs and separates the chest from the abdomen.
    source: wikipedia-diaphragm
  - text: When it contracts it flattens, the chest gets larger, and air is pulled in.
    source: openstax-breathing
  - text: Breathing rate rises during exercise because working cells need more oxygen.
    source: openstax-breathing
lookAlikes: [lungs, liver, stomach]
