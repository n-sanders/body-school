slug: lungs
name: Lungs
category: circulation
attributes:
  system: Respiratory
  location: Chest, one on each side
  role: Exchange oxygen and carbon dioxide
summary: Two spongy organs where gases cross a thin barrier between air sacs and nearby blood.
traits:
  - text: Air reaches the lungs through the windpipe, which splits into bronchi.
    source: openstax-lungs
  - text: Tiny air sacs called alveoli are wrapped in capillaries, so gases can move between air and blood.
    source: openstax-lungs
  - text: The right lung is usually a bit larger and has three lobes; the left has two, leaving room for the heart.
    source: wikipedia-lung
lookAlikes:
  - heart
  - diaphragm
sources:
