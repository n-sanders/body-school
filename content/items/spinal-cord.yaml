slug: spinal-cord
name: Spinal cord
category: control
attributes:
  system: Nervous
  location: Inside the spine
  role: Carries signals between the brain and the body
summary: The main nerve cable running through the vertebrae, with nerves branching out to the body.
traits:
  - text: The spinal cord is part of the central nervous system, together with the brain.
    source: openstax-cns
  - text: Sensory signals travel in toward the cord, and motor signals travel out to muscles and glands.
    source: openstax-nerves
  - text: Some quick reflexes are routed through the spinal cord before you have time to think.
    source: wikipedia-cord
