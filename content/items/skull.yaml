slug: skull
name: Skull
category: support
attributes:
  system: Skeletal
  location: Head
  role: Protects the brain and holds the teeth
summary: A bony case around the brain, with a movable lower jaw and openings for the eyes, nose, and mouth.
traits:
  - text: The rounded cranium wraps the brain, and the seams between its bones barely move.
    source: openstax-skeleton
  - text: The lower jaw moves at joints with the rest of the skull; the skull is not one solid unmoving bone.
    source: wikipedia-skull
  - text: Openings in the front of the skull make room for the eyes, nose, and teeth.
    source: wikipedia-skull
