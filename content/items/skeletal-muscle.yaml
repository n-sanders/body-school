slug: skeletal-muscle
name: Skeletal muscle
category: support
attributes:
  system: Muscular
  location: Attached to bones
  role: Pulls on bones to move the body
summary: Voluntary muscle with a striped look, attached to bones by tendons.
traits:
  - text: Skeletal muscle is the kind you can choose to contract, such as when you lift an arm.
    source: openstax-muscle
  - text: Under a microscope it looks striped, which is why it is called striated muscle.
    source: wikipedia-muscle
  - text: Tendons connect skeletal muscle to bone. The muscle pulls; it does not push.
    source: openstax-muscle
