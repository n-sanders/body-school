slug: skin
name: Skin
category: protection
attributes:
  system: Integumentary
  location: Outer surface of the body
  role: Blocks injury and germs and helps cool the body
summary: The body's outer covering, with a thin epidermis over a thicker dermis of vessels, nerves, and glands.
traits:
  - text: The outer epidermis is a barrier that keeps many germs out and water in.
    source: openstax-skin
  - text: The dermis underneath holds blood vessels, nerve endings, sweat glands, and oil glands.
    source: openstax-skin
  - text: Sweat and changes in blood flow help control body temperature, and sunlight on skin helps make vitamin D.
    source: wikipedia-skin
lookAlikes:
  - lymph-nodes
  - spleen
