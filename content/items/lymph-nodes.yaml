    title: "OpenStax Anatomy and Physiology 2e: Anatomy of the Lymphatic and Immune Systems"
    url: https://openstax.org/books/anatomy-and-physiology-2e/pages/21-1-anatomy-of-the-lymphatic-and-immune-systems
  - id: wikipedia-node
    title: "Wikipedia: Lymph node"
    url: https://en.wikipedia.org/wiki/Lymph_node
