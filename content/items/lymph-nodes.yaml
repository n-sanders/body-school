slug: lymph-nodes
name: Lymph nodes
category: protection
attributes:
  system: Lymphatic and immune
  location: Along lymph vessels, clustered at the neck, armpits, and groin
  role: Filter lymph and house immune cells
summary: Small bean-shaped stations that filter lymph and give immune cells a place to meet invaders.
traits:
  - text: Some fluid leaves blood capillaries and surrounds tissue cells. Once collected inside lymph vessels, it is called lymph and travels toward return to blood.
    source: openstax-lymph
  - text: Lymph nodes filter that fluid and are packed with white blood cells.
    source: openstax-lymph
  - text: Nodes often swell when immune cells multiply during an infection.
    source: wikipedia-node
lookAlikes:
  - spleen
  - thyroid-gland
  - blood-vessels
