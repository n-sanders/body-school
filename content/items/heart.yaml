slug: heart
name: Heart
category: circulation
attributes:
  system: Circulatory
  location: Center of the chest, tipped left
  role: Pumps blood to the lungs and the body
summary: A four-chamber muscular pump that keeps blood moving day and night.
traits:
  - text: The heart has two upper rooms (atria) and two lower rooms (ventricles).
    source: openstax-heart
  - text: The right side sends blood to the lungs. The left side sends blood to the rest of the body.
    source: openstax-heart
  - text: Heart muscle is cardiac muscle. It contracts on its own, without you deciding to flex it.
    source: wikipedia-heart
