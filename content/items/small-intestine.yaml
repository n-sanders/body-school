slug: small-intestine
name: Small intestine
category: fuel
attributes:
  system: Digestive
  location: Coiled in the center of the abdomen
  role: Finishes digestion and absorbs nutrients
summary: A long, narrow, coiled tube where most chemical digestion and nutrient absorption happen.
traits:
  - text: Most chemical digestion and almost all nutrient absorption happen in the small intestine.
    source: openstax-intestine
  - text: The lining has tiny finger-like villi that give a huge surface for absorption.
    source: openstax-intestine
  - text: Sugars, amino acids, fats, vitamins, minerals, and water cross into blood or lymph here.
    source: wikipedia-small
