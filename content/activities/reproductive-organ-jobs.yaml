id: reproductive-organ-jobs
lesson: reproductive-organs
title: Match the organs to their jobs
prompt: Drag each job onto the matching organ name. Use the diagrams above if you need a reminder.
labels:
  - Hold and release egg cells
  - Make sperm cells
  - Provide a place where a baby can grow
  - Form a passage from the cervix to outside the body
cards:
