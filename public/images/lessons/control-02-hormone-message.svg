<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Hormone message</title><desc>A gland releases a message into the blood.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>A slower hormone message</text><circle cx='140' cy='180' r='40' fill='#e6c15c' stroke='#b89030' stroke-width='3'/><text x='140' y='186' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>gland</text><path d='M190 180 H620' fill='none' stroke='#d64545' stroke-width='8' /><circle cx='280' cy='180' r='10' fill='#fff3c4' stroke='#b89030' stroke-width='2'/><circle cx='400' cy='180' r='10' fill='#fff3c4' stroke='#b89030' stroke-width='2'/><circle cx='540' cy='180' r='10' fill='#fff3c4' stroke='#b89030' stroke-width='2'/><text x='400' y='260' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>The message rides in the blood to many cells</text>
