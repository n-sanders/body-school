<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Three muscle types</title><desc>Skeletal, cardiac, and smooth muscle.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Three kinds of muscle</text><rect x='40' y='80' width='230' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='155.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Skeletal</text><text x='155' y='300' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>you choose to move it</text><path d='M80 180 Q155 140 230 180' fill='none' stroke='#d4534e' stroke-width='16' /><rect x='290' y='80' width='230' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='405.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Cardiac</text><text x='405' y='300' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>heart, automatic</text><path d='M330 180 Q405 140 480 180' fill='none' stroke='#d4534e' stroke-width='16' /><rect x='540' y='80' width='230' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='655.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Smooth</text><text x='655' y='300' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>organs, automatic</text><path d='M580 180 Q655 140 730 180' fill='none' stroke='#d4534e' stroke-width='16' /><text x='155' y='230' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>stripes</text><text x='405' y='230' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>branches</text><text x='655' y='230' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>smooth sheets</text>
</svg>
