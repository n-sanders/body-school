<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Start of digestion</title><desc>Mouth, esophagus, and stomach.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Journey of a sandwich</text><rect x='60' y='90' width='210' height='220' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='165.0' y='118' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Mouth</text><text x='165' y='250' text-anchor='middle' font-size='15' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>chew + saliva</text><line x1='274' y1='200' x2='306' y2='200' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='306.0,200.0 296.1,204.8 296.1,195.2' fill='#9c4324'/><rect x='310' y='90' width='210' height='220' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='415.0' y='118' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Esophagus</text><text x='415' y='250' text-anchor='middle' font-size='15' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>muscle waves</text><line x1='524' y1='200' x2='556' y2='200' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='556.0,200.0 546.1,204.8 546.1,195.2' fill='#9c4324'/><rect x='560' y='90' width='210' height='220' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='665.0' y='118' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Stomach</text><text x='665' y='250' text-anchor='middle' font-size='15' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>acid + churning</text>
</svg>
