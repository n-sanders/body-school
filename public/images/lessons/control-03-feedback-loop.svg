<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Feedback loop</title><desc>Sensor, control center, effector, and reversal.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Negative feedback</text><rect x='40' y='140' width='170' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='125' y='186' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Sensor notices</text><line x1='212' y1='180' x2='228' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='228.0,180.0 218.1,184.8 218.1,175.2' fill='#9c4324'/><rect x='230' y='140' width='170' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='315' y='186' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Control center decides</text><line x1='402' y1='180' x2='418' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='418.0,180.0 408.1,184.8 408.1,175.2' fill='#9c4324'/><rect x='420' y='140' width='170' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='505' y='186' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Effector acts</text><line x1='592' y1='180' x2='608' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='608.0,180.0 598.1,184.8 598.1,175.2' fill='#9c4324'/><rect x='610' y='140' width='170' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='695' y='186' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Change reverses</text><text x='400' y='300' text-anchor='middle' font-size='16' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>The response brings the body back toward its usual range</text>
</svg>
