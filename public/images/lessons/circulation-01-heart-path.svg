<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Path through the heart</title><desc>Blood visits the lungs and then the body.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='36' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>A drop of blood through the heart</text><g transform='translate(180 210) scale(1.3) translate(-100 -100)'><path d='M100 40 C100 28 78 16 62 32 C46 48 52 70 70 88 L100 118 L130 88 C148 70 154 48 138 32 C122 16 100 28 100 40 Z' fill='#c53636' stroke='#8e2424' stroke-width='3' /><path d='M70 20 Q100 8 132 28' fill='none' stroke='#d64545' stroke-width='6' /><path d='M100 48 L100 108 M72 78 L128 78' fill='none' stroke='#f6d0d0' stroke-width='2' /><circle cx='84' cy='62' r='7' fill='#f4d2d2' stroke='none' stroke-width='0'/><circle cx='116' cy='66' r='7' fill='#f4d2d2' stroke='none' stroke-width='0'/></g><rect x='430' y='80' width='320' height='46' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='590' y='110' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>1. Body to right side</text><rect x='430' y='140' width='320' height='46' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='590' y='170' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>2. Right side to lungs</text><rect x='430' y='200' width='320' height='46' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='590' y='230' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>3. Lungs to left side</text><rect x='430' y='260' width='320' height='46' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='590' y='290' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>4. Left side to body</text>
</svg>
