<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Nerve signal</title><desc>A fast impulse and a chemical gap.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>A fast nerve signal</text><path d='M80 180 Q200 120 320 180' fill='none' stroke='#e2b84a' stroke-width='8' /><circle cx='330' cy='180' r='16' fill='#e2b84a' stroke='#b89030' stroke-width='3'/><path d='M360 180 Q480 120 620 180' fill='none' stroke='#e2b84a' stroke-width='8' /><text x='345' y='240' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>gap</text><line x1='80' y1='120' x2='620' y2='120' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='620.0,120.0 610.1,124.8 610.1,115.2' fill='#9c4324'/><text x='400' y='100' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>electrical impulse, then a chemical hop</text>
</svg>
