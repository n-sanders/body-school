<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Path of inhaled air</title><desc>From nose or mouth to the air sacs.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Path of a breath</text><circle cx='90' cy='180' r='36' fill='#f4c3cb' stroke='#e294a2' stroke-width='3'/><text x='90' y='186' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>1</text><text x='90' y='260' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Nose or mouth</text><line x1='132' y1='180' x2='152' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='152.0,180.0 142.1,184.8 142.1,175.2' fill='#9c4324'/><circle cx='240' cy='180' r='36' fill='#f4c3cb' stroke='#e294a2' stroke-width='3'/><text x='240' y='186' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>2</text><text x='240' y='260' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Windpipe</text><line x1='282' y1='180' x2='302' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='302.0,180.0 292.1,184.8 292.1,175.2' fill='#9c4324'/><circle cx='390' cy='180' r='36' fill='#f4c3cb' stroke='#e294a2' stroke-width='3'/><text x='390' y='186' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>3</text><text x='390' y='260' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Bronchi</text><line x1='432' y1='180' x2='452' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='452.0,180.0 442.1,184.8 442.1,175.2' fill='#9c4324'/><circle cx='540' cy='180' r='36' fill='#f4c3cb' stroke='#e294a2' stroke-width='3'/><text x='540' y='186' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>4</text><text x='540' y='260' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Lungs</text><line x1='582' y1='180' x2='602' y2='180' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='602.0,180.0 592.1,184.8 592.1,175.2' fill='#9c4324'/><circle cx='690' cy='180' r='36' fill='#f4c3cb' stroke='#e294a2' stroke-width='3'/><text x='690' y='186' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>5</text><text x='690' y='260' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Air sacs</text>
</svg>
