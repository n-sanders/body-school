<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Three vessel types</title><desc>Arteries, capillaries, and veins.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Three kinds of blood vessels</text><rect x='50' y='80' width='220' height='260' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='160.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Artery</text><line x1='90' y1='180' x2='230' y2='180' stroke='#d64545' stroke-width='16' stroke-linecap='round'/><text x='160' y='250' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>away from the heart</text><rect x='300' y='80' width='220' height='260' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='410.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Capillary</text><line x1='340' y1='180' x2='480' y2='180' stroke='#c47a7a' stroke-width='4' stroke-linecap='round'/><text x='410' y='250' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>exchange happens here</text><rect x='550' y='80' width='220' height='260' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='660.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Vein</text><line x1='590' y1='180' x2='730' y2='180' stroke='#3e6ea5' stroke-width='16' stroke-linecap='round'/><text x='660' y='250' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>back to the heart</text>
</svg>
