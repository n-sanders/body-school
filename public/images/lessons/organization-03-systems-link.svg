<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Systems linked together</title><desc>Muscles depend on blood, lungs, and food.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Systems depend on each other</text><rect x='70' y='140' width='140' height='90' rx='16' fill='#d4534e' stroke='#2c2825' stroke-width='2'/><text x='140' y='192' text-anchor='middle' font-size='18' fill='#fff' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Muscles</text><line x1='212' y1='185' x2='246' y2='185' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='246.0,185.0 236.1,189.8 236.1,180.2' fill='#9c4324'/><rect x='250' y='140' width='140' height='90' rx='16' fill='#d64545' stroke='#2c2825' stroke-width='2'/><text x='320' y='192' text-anchor='middle' font-size='18' fill='#fff' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Blood</text><line x1='392' y1='185' x2='426' y2='185' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='426.0,185.0 416.1,189.8 416.1,180.2' fill='#9c4324'/><rect x='430' y='140' width='140' height='90' rx='16' fill='#f4c3cb' stroke='#2c2825' stroke-width='2'/><text x='500' y='192' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Lungs</text><line x1='572' y1='185' x2='606' y2='185' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='606.0,185.0 596.1,189.8 596.1,180.2' fill='#9c4324'/><rect x='610' y='140' width='140' height='90' rx='16' fill='#e2b27a' stroke='#2c2825' stroke-width='2'/><text x='680' y='192' text-anchor='middle' font-size='18' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Food</text><text x='400' y='300' text-anchor='middle' font-size='16' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>Moving needs oxygen, blood, and fuel together</text>
</svg>
