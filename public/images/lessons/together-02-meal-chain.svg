<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Meal chain</title><desc>How several systems handle a meal.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Systems after a meal</text><rect x='30' y='150' width='140' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='100' y='196' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Digest</text><line x1='172' y1='190' x2='182' y2='190' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='182.0,190.0 172.1,194.8 172.1,185.2' fill='#9c4324'/><rect x='184' y='150' width='140' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='254' y='196' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Absorb</text><line x1='326' y1='190' x2='336' y2='190' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='336.0,190.0 326.1,194.8 326.1,185.2' fill='#9c4324'/><rect x='338' y='150' width='140' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='408' y='196' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Blood carries</text><line x1='480' y1='190' x2='490' y2='190' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='490.0,190.0 480.1,194.8 480.1,185.2' fill='#9c4324'/><rect x='492' y='150' width='140' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='562' y='196' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Insulin helps</text><line x1='634' y1='190' x2='644' y2='190' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='644.0,190.0 634.1,194.8 634.1,185.2' fill='#9c4324'/><rect x='646' y='150' width='140' height='80' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='716' y='196' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Kidneys clean</text>
