<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Joint types</title><desc>Fixed, hinge, and ball-and-socket joints.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Joints do not all move the same way</text><rect x='40' y='80' width='230' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='155.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Fixed</text><rect x='100' y='180' width='50' height='40' rx='4' fill='#ead9bc' stroke='#c4ae8e' stroke-width='3'/><rect x='155' y='180' width='50' height='40' rx='4' fill='#ead9bc' stroke='#c4ae8e' stroke-width='3'/><text x='155' y='280' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>skull seams</text><rect x='290' y='80' width='230' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='405.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Hinge</text><rect x='350' y='160' width='110' height='28' rx='8' fill='#ead9bc' stroke='#c4ae8e' stroke-width='3'/><rect x='430' y='188' width='28' height='80' rx='8' fill='#ead9bc' stroke='#c4ae8e' stroke-width='3'/><text x='405' y='300' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>knee, elbow</text><rect x='540' y='80' width='220' height='280' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='650.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Ball and socket</text><circle cx='650' cy='190' r='28' fill='#ead9bc' stroke='#c4ae8e' stroke-width='3'/><ellipse cx='650' cy='240' rx='26' ry='18' fill='#f7efe2' stroke='#c4ae8e' stroke-width='3'/><text x='650' y='310' text-anchor='middle' font-size='14' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>shoulder, hip</text>
</svg>
