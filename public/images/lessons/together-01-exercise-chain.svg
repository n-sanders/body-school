<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Exercise chain</title><desc>How several systems respond to exercise.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='36' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Systems during exercise</text><rect x='40' y='80' width='720' height='44' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='80' y='108' text-anchor='start' font-size='16' fill='#9c4324' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Muscles</text><text x='240' y='108' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>demand more oxygen and fuel</text><rect x='40' y='132' width='720' height='44' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='80' y='160' text-anchor='start' font-size='16' fill='#9c4324' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Lungs</text><text x='240' y='160' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>breathe faster</text><rect x='40' y='184' width='720' height='44' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='80' y='212' text-anchor='start' font-size='16' fill='#9c4324' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Heart</text><text x='240' y='212' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>beat faster and send more blood</text><rect x='40' y='236' width='720' height='44' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='80' y='264' text-anchor='start' font-size='16' fill='#9c4324' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Nerves</text><text x='240' y='264' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>coordinate the changes</text><rect x='40' y='288' width='720' height='44' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='80' y='316' text-anchor='start' font-size='16' fill='#9c4324' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Skin</text><text x='240' y='316' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>sweat to cool the body</text>
</svg>
