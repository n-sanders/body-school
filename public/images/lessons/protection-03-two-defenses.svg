<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Two defenses</title><desc>Barriers first, then immune cells.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Two lines of defense</text><rect x='40' y='80' width='340' height='260' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='210.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>First: barriers</text><text x='210' y='180' text-anchor='middle' font-size='18' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>skin, mucus, acid</text><rect x='420' y='80' width='340' height='260' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='590.0' y='108' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Second: immune cells</text><text x='590' y='180' text-anchor='middle' font-size='18' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>find and attack</text><line x1='384' y1='210' x2='416' y2='210' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='416.0,210.0 406.1,214.8 406.1,205.2' fill='#9c4324'/>
</svg>
