stem-ui, sans-serif'>System</text><line x1='618' y1='160' x2='634' y2='160' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='634.0,160.0 624.1,164.8 624.1,155.2' fill='#9c4324'/><rect x='636' y='80' width='130' height='250' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><circle cx='701' cy='160' r='50' fill='#f3e6c8' stroke='#2c2825' stroke-width='2'/><text x='701' y='280' text-anchor='middle' font-size='16' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Body</text>
