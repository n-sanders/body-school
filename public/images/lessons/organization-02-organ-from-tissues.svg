<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Tissues inside an organ</title><desc>A stomach uses lining, muscle, nerve, and blood.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>An organ uses more than one tissue</text><path d='M180 80 Q150 160 210 250 Q300 300 360 200 Q390 120 300 90 Q230 70 180 80 Z' fill='#e2b27a' stroke='#b8884e' stroke-width='3' /><text x='560' y='120' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Lining: epithelial</text><text x='560' y='160' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Wall: muscle</text><text x='560' y='200' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Nerves: signals</text><text x='560' y='240' text-anchor='start' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Blood: connective</text><line x1='520' y1='120' x2='360' y2='130' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='360.0,130.0 369.6,124.6 370.2,134.2' fill='#9c4324'/><line x1='520' y1='200' x2='300' y2='200' stroke='#9c4324' stroke-width='3.5' stroke-linecap='round'/><polygon points='300.0,200.0 309.9,195.2 309.9,204.8' fill='#9c4324'/>
</svg>
