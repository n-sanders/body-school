<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Jobs of skin</title><desc>Barrier, water, touch, cooling, and vitamin D.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Jobs of the skin</text><rect x='40' y='140' width='136' height='120' rx='16' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><text x='108' y='206' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Blocks germs</text><rect x='190' y='140' width='136' height='120' rx='16' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><text x='258' y='206' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Holds water in</text><rect x='340' y='140' width='136' height='120' rx='16' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><text x='408' y='206' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Senses touch</text><rect x='490' y='140' width='136' height='120' rx='16' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><text x='558' y='206' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Cools by sweating</text><rect x='640' y='140' width='136' height='120' rx='16' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><text x='708' y='206' text-anchor='middle' font-size='14' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Makes vitamin D</text>
</svg>
