<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Four tissue types</title><desc>Epithelial, connective, muscle, and nervous tissue.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='36' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Four tissue types</text><rect x='30' y='70' width='170' height='250' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='115.0' y='98' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Epithelial</text><text x='115' y='290' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>covers surfaces</text><rect x='220' y='70' width='170' height='250' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='305.0' y='98' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Connective</text><text x='305' y='290' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>connects parts</text><rect x='410' y='70' width='170' height='250' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='495.0' y='98' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Muscle</text><text x='495' y='290' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>can shorten</text><rect x='600' y='70' width='170' height='250' rx='10' fill='#fffdf9' stroke='#8d7f72' stroke-width='2'/><text x='685.0' y='98' text-anchor='middle' font-size='15' fill='#9c4324' font-family='Segoe UI, system-ui, sans-serif'>Nervous</text><text x='685' y='290' text-anchor='middle' font-size='13' fill='#6d645c' font-family='Segoe UI, system-ui, sans-serif'>carries signals</text><rect x='50' y='130' width='130' height='16' rx='3' fill='#f6d7b8' stroke='#e2b48a' stroke-width='2'/><rect x='50' y='150' width='130' height='40' rx='3' fill='#f7e7d4' stroke='#e2c8aa' stroke-width='2'/><circle cx='250' cy='150' r='10' fill='#ead9bc' stroke='none' stroke-width='0'/><circle cx='280' cy='180' r='14' fill='#e7d3ef' stroke='none' stroke-width='0'/><circle cx='240' cy='190' r='8' fill='#7dcea0' stroke='none' stroke-width='0'/><path d='M430 140 Q470 180 430 220' fill='none' stroke='#d4534e' stroke-width='10' /><path d='M620 130 L700 170 L640 210 L610 160 Z' fill='none' stroke='#e2b84a' stroke-width='3' /><circle cx='700' cy='170' r='8' fill='#e2b84a' stroke='none' stroke-width='0'/>
</svg>
