<svg xmlns='http://www.w3.org/2000/svg' width='800' height='380' viewBox='0 0 800 380' role='img'>
<title>Kidney filter</title><desc>Keep useful substances and release wastes.</desc>
<rect width='100%' height='100%' fill='#fbf6ef'/>
<text x='400' y='40' text-anchor='middle' font-size='22' fill='#2c2825' font-weight='700' font-family='Segoe UI, system-ui, sans-serif'>Kidneys keep the useful parts</text><g transform='translate(200 190) scale(1.0) translate(-100 -100)'><path d='M40 40 Q18 80 36 130 Q60 156 78 120 Q90 80 70 40 Q58 28 40 40 Z' fill='#d16b6b' stroke='#a84e4e' stroke-width='3' /><path d='M160 40 Q182 80 164 130 Q140 156 122 120 Q110 80 130 40 Q142 28 160 40 Z' fill='#d16b6b' stroke='#a84e4e' stroke-width='3' /><path d='M58 70 Q70 90 60 112' fill='none' stroke='#f8e4e4' stroke-width='3' /><path d='M142 70 Q130 90 140 112' fill='none' stroke='#f8e4e4' stroke-width='3' /><path d='M62 124 C80 150 80 150 96 168' fill='none' stroke='#a84e4e' stroke-width='4' /><path d='M138 124 C120 150 120 150 104 168' fill='none' stroke='#a84e4e' stroke-width='4' /><ellipse cx='100' cy='176' rx='22' ry='14' fill='#f3c9c4' stroke='#a84e4e' stroke-width='3'/></g><rect x='430' y='110' width='280' height='70' rx='10' fill='#e7f6ea' stroke='#8d7f72' stroke-width='2'/><text x='570' y='152' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Keep: water, salts, sugar</text><rect x='430' y='210' width='280' height='70' rx='10' fill='#fde8e8' stroke='#8d7f72' stroke-width='2'/><text x='570' y='252' text-anchor='middle' font-size='16' fill='#2c2825' font-family='Segoe UI, system-ui, sans-serif'>Release: wastes, extra water</text>
</svg>
